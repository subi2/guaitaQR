:root{
  --bg:#0a0c07;--bg2:#12160c;--bg3:#1a2011;--line:#2b3519;
  --ink:#eef4e0;--dim:#94a083;--acid:#c8ff00;
  --ok:#2bff88;--warn:#ffb000;--bad:#ff2e55;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
[hidden]{display:none!important}

/* Menú en cascada */
.menubar{display:flex;border-bottom:2px solid var(--acid);background:var(--bg);position:sticky;top:0;z-index:30}
.mb{position:relative}
.mb>button{min-height:46px;padding:0 16px;background:none;color:var(--ink);border:0;font:600 15px var(--sans);cursor:pointer}
.mb>button[aria-expanded=true]{background:var(--acid);color:#0a0c07}
.dd{position:absolute;left:0;top:100%;min-width:260px;max-width:calc(100vw - 16px);background:var(--bg2);
  border:2px solid var(--acid);box-shadow:5px 5px 0 var(--acid);display:none;padding:4px 0}
.mb.open .dd{display:block}
.mb.dir .dd{left:auto;right:0}
.dd button{display:flex;width:100%;min-height:46px;align-items:center;gap:10px;background:none;border:0;color:var(--ink);
  padding:0 14px;font:400 15px var(--sans);text-align:left;cursor:pointer}
.dd button:hover,.dd button:focus-visible{background:var(--acid);color:#0a0c07;outline:none}
.dd button[disabled]{color:#5b6650;pointer-events:none}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dd .ck{display:inline-block;width:1.1em;font-family:var(--mono)}

/* Estructura */
.wrap{max-width:1040px;margin:0 auto;padding:14px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.logo{font:600 30px/1 var(--sans);letter-spacing:-.02em}
.logo b{background:var(--acid);color:#0a0c07;padding:0 7px;margin-left:3px;font-family:var(--mono);font-weight:700}
.ver{font:400 13px var(--mono);color:var(--dim)}
.net{margin-left:auto;display:flex;align-items:center;gap:9px;border:2px solid var(--ok);color:var(--ok);background:transparent;
  padding:5px 11px;font:600 14px/1.2 var(--sans);cursor:pointer;text-align:left}
.net .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.net small{display:block;font:400 11.5px/1.25 var(--sans);color:var(--dim)}
.grid{display:grid;gap:18px}
@media(min-width:860px){.grid{grid-template-columns:380px 1fr;align-items:start}.scan{position:sticky;top:62px}}

/* Visor */
.vista{position:relative;aspect-ratio:1/1;max-height:62vh;width:100%;background:#000;border:2px solid var(--line);overflow:hidden}
.vista video,.vista img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.vista img{object-fit:contain;background:#000}
.vista.viu video{display:block}
.vista.foto img{display:block}
.vista .buit{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;color:var(--dim)}
.vista.viu .buit,.vista.foto .buit{display:none}
.marc{position:absolute;inset:14%;pointer-events:none}
.marc i{position:absolute;width:30px;height:30px;border:4px solid var(--acid)}
.marc i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.marc i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.marc i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.marc i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.lin{position:absolute;left:14%;right:14%;top:14%;height:3px;background:var(--acid);box-shadow:0 0 14px var(--acid);display:none}
.vista.viu .lin{display:block;animation:esc 2.2s ease-in-out infinite alternate}
@keyframes esc{to{top:86%}}
@media(prefers-reduced-motion:reduce){.vista.viu .lin{animation:none;top:50%}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.btn{min-height:48px;padding:6px 14px;background:var(--bg2);color:var(--ink);border:2px solid var(--ink);
  font:600 15px/1.2 var(--sans);cursor:pointer;box-shadow:4px 4px 0 var(--line)}
.btn.primary{background:var(--acid);color:#0a0c07;border-color:var(--acid);box-shadow:4px 4px 0 #5b7300}
.btn.risc{border-color:var(--bad);color:var(--bad)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.estat{min-height:1.5em;margin:12px 0 0;color:var(--dim);font-size:14.5px}
.estat.e{color:var(--warn)}

/* Resultat */
.buitres{border:2px dashed var(--line);padding:28px 22px;color:var(--dim)}
.buitres h2{margin:0 0 8px;color:var(--ink);font:700 22px/1.2 var(--sans)}
.buitres p{margin:0;max-width:46ch}
.n-g{--v:var(--ok)}.n-y{--v:var(--warn)}.n-r{--v:var(--bad)}
.verd{display:flex;justify-content:space-between;gap:16px;background:var(--v);color:#0a0c07;padding:18px 18px 22px}
.verd h2{margin:6px 0 8px;font:700 clamp(40px,12vw,68px)/.95 var(--sans);letter-spacing:-.035em}
.verd p{margin:0;font-weight:500;max-width:36ch}
.tipus{font:600 13px var(--mono);background:#0a0c07;color:var(--v);padding:2px 8px;display:inline-block}
.sem{display:flex;flex-direction:column;gap:8px;background:#0a0c07;padding:10px;align-self:flex-start;border-radius:40px;flex:none}
.sem i{width:26px;height:26px;border-radius:50%;border:2px solid #3a3a3a;display:block}
.sem .r{border-color:#5a1424}.sem .y{border-color:#5a4210}.sem .g{border-color:#14503a}
.sem .r.on{background:var(--bad);border-color:var(--bad);box-shadow:0 0 12px var(--bad)}
.sem .y.on{background:var(--warn);border-color:var(--warn);box-shadow:0 0 12px var(--warn)}
.sem .g.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 12px var(--ok)}
.sec{margin-top:16px}
.sec>h3{margin:0 0 6px;font:600 14px var(--sans);color:var(--dim)}
.host{background:var(--bg2);border:2px solid var(--line);padding:14px 16px}
.hv{font:500 clamp(21px,6.2vw,34px)/1.3 var(--mono);overflow-wrap:anywhere;word-break:break-all}
.hv .sub{color:var(--dim)}
.hv .dom{color:var(--v);font-weight:700;border-bottom:4px solid var(--v)}
.tec{margin:8px 0 0;font:400 13px var(--mono);color:var(--dim);overflow-wrap:anywhere;word-break:break-all}
.mot{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.mot li{padding:10px 12px 10px 14px;background:var(--bg2);border-left:8px solid var(--acid)}
.mot li.r{border-left-color:var(--bad)}.mot li.y{border-left-color:var(--warn)}
.mot em{font:600 12px var(--mono);font-style:normal;color:var(--dim);margin-right:8px}
.mot li.r em{color:var(--bad)}.mot li.y em{color:var(--warn)}
.mot b{font-weight:600}
.mot span{display:block;color:var(--dim);font-size:14.5px;margin-top:2px}
.adr{background:#000;border:2px solid var(--line);padding:12px 14px;font:400 15px/1.55 var(--mono);overflow-wrap:anywhere;word-break:break-all;max-height:220px;overflow:auto}
.adr mark{background:var(--acid);color:#0a0c07;padding:0 2px}
.adr .ui{background:var(--bad);color:#0a0c07;padding:0 2px}
.adr .iv{background:var(--warn);color:#0a0c07;font-size:12px;padding:0 2px}
.fil{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.fil .btn{min-height:44px;font-size:14.5px;padding:4px 12px}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0;background:var(--bg2);border:2px solid var(--line);padding:12px 14px}
.dl dt{color:var(--dim);font-size:14px}
.dl dd{margin:0;font:400 14px/1.45 var(--mono);overflow-wrap:anywhere;word-break:break-all}
.dl dd.r{color:var(--bad)}.dl dd.y{color:var(--warn)}
.dl .mini{margin-left:8px;min-height:32px;padding:0 8px;font-size:13px;box-shadow:none;border-width:1px}
@media(max-width:440px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:8px}}
.enl{background:var(--bg2);border:2px solid var(--line);border-left:8px solid var(--v);padding:12px 14px;margin-top:10px}
.enl .hv{font-size:clamp(17px,5vw,24px)}
.enl .mot{margin-top:10px}

/* Modal */
.mod{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.84)}
.mod.open{display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mod.open{align-items:center}}
.mcard{background:var(--bg);border:2px solid var(--acid);box-shadow:8px 8px 0 var(--acid);width:min(740px,100%);max-height:94vh;
  display:flex;flex-direction:column;outline:none}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:2px solid var(--acid)}
.mhead h2{margin:0;font:700 20px/1.2 var(--sans)}
.mbody{overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.mbody h3{font:700 18px/1.25 var(--sans);margin:26px 0 6px;color:var(--acid)}
.mbody h3:first-child{margin-top:0}
.mbody p,.mbody li{max-width:66ch}
.mbody ul{padding-left:20px}
.mbody li{margin:4px 0}
.mbody code{font:400 14px var(--mono);background:var(--bg3);padding:1px 5px}
.mbody .nota{border-left:8px solid var(--acid);background:var(--bg2);padding:10px 14px;margin:12px 0}
.mbody .idx{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;padding:0;list-style:none}
.mbody .idx button{min-height:40px;padding:0 12px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);font:500 14px var(--sans);cursor:pointer}
.mbody .idx button:hover{border-color:var(--acid)}
.sem3{display:grid;gap:8px;margin:10px 0}
.sem3 div{padding:10px 12px;color:#0a0c07;font-weight:500}
.sem3 .g{background:var(--ok)}.sem3 .y{background:var(--warn)}.sem3 .r{background:var(--bad)}
.mfoot{padding:12px 16px;border-top:2px solid var(--line);display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mfoot label{margin-right:auto;display:flex;gap:10px;align-items:center;font-size:14.5px}
.mfoot input{width:22px;height:22px;accent-color:var(--bad)}
.ctx{padding:14px 16px}
.ctx .hv{font-size:clamp(19px,5.5vw,28px)}
.prova{margin-top:10px;font-weight:500}
.prova.ok{color:var(--ok)}.prova.no{color:var(--warn)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--acid);color:#0a0c07;
  padding:10px 16px;font:600 15px var(--sans);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:4px 4px 0 #000;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.peu{margin-top:30px;color:var(--dim);font-size:13.5px}
.peu button{background:none;border:0;color:var(--acid);font:inherit;text-decoration:underline;cursor:pointer;padding:6px 0}

<nav class="menubar" id="menubar" role="menubar" aria-label="Menú principal"></nav>

<div class="wrap">

    <span class="ver">v1.0</span>
    <button class="net" id="netChip" type="button" aria-label="Sense xarxa: res no surt d'aquest dispositiu. Més informació">
      <span class="dot" aria-hidden="true"></span>
      <span>Sense xarxa<small>Res no surt d'aquest dispositiu</small></span>
    </button>
  </div>

  <main class="grid">
    <section class="scan" aria-label="Lectura del QR">
      <div class="vista" id="vista">
        <video id="video" playsinline muted></video>
        <img id="prev" alt="Foto carregada">
        <div class="buit" id="buit"><span>Aquí apareix la càmera o la foto.<br>Res no es desa ni s'envia.</span></div>
        <div class="marc" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="lin" aria-hidden="true"></div>
      </div>
      <div class="acts">
        <button class="btn primary" id="btnCam" type="button">Escaneja amb càmera</button>

      <p class="estat" id="estat" role="status" aria-live="polite"></p>
    </section>

    <section id="res" aria-live="polite" aria-label="Resultat"></section>
  </main>

  <p class="peu">guaitaQR v1.0. Part de Guaita Apps. Llicència AGPL-3.0-only.
    <button type="button" id="peuAjuda">Com funciona i seguretat</button></p>
</div>

<div class="mod" id="mod" aria-hidden="true">
  <div class="mcard" id="mcard" role="dialog" aria-modal="true" aria-labelledby="mtit" tabindex="-1">
    <div class="mhead"><h2 id="mtit"></h2><button class="btn" id="mclose" type="button" aria-label="Tanca">Tanca</button></div>
    <div class="mbody" id="mbody"></div>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Contingut estàtic de la finestra d'ajuda (mai s'hi insereix text descodificat) -->
<template id="tplAjuda">
  <ul class="idx">
    <li><button type="button" data-go="h-que">Què fa</button></li>
    <li><button type="button" data-go="h-aill">Res no surt</button></li>
    <li><button type="button" data-go="h-llegeix">Com llegeix</button></li>
    <li><button type="button" data-go="h-semafor">Semàfor</button></li>
    <li><button type="button" data-go="h-comprova">Què comprova</button></li>
    <li><button type="button" data-go="h-altres">Altres tipus</button></li>
    <li><button type="button" data-go="h-curts">Escurçadors</button></li>
    <li><button type="button" data-go="h-limits">Límits</button></li>
    <li><button type="button" data-go="h-bones">Bones pràctiques</button></li>
    <li><button type="button" data-go="h-copiar">En copiar</button></li>
    <li><button type="button" data-go="h-proba">Prova d'aïllament</button></li>
  </ul>

  <h3 id="h-que">Què fa</h3>
  <p>Llegeix el QR dins del teu dispositiu i et mostra el que hi ha escrit, <b>abans que res s'obri</b>. Un QR és només text: si és una adreça web, aquí la veus sencera, separada en parts i amb el domini real destacat.</p>
  <p>Mai no obre cap enllaç pel seu compte. Només el pots obrir tu, amb un botó i una confirmació.</p>

  <h3 id="h-aill">Res no surt d'aquest dispositiu</h3>
  <ul>
    <li><b>No fa cap petició de xarxa.</b> No visita l'enllaç del QR, no consulta cap servei, no envia estadístiques.</li>
    <li><b>El navegador ho imposa.</b> El fitxer porta una política de seguretat (<code>connect-src 'none'</code>) que bloqueja qualsevol connexió, encara que hi hagués un error al codi.</li>
    <li><b>No desa res.</b> Ni historial, ni galetes, ni emmagatzematge. En tancar la pàgina, no en queda res.</li>
    <li><b>No carrega res d'enlloc.</b> El lector de QR, les tipografies i el codi van dins del mateix fitxer.</li>
    <li><b>Càmera i fotos es processen en memòria</b> i es descarten. No es pugen enlloc.</li>
  </ul>
  <p>Ho pots comprovar tu: activa el mode avió i comprova que funciona igual, executa la prova d'aïllament d'aquesta finestra, o llegeix el codi font (és obert, AGPL-3.0-only).</p>

  <h3 id="h-llegeix">Com llegeix el QR</h3>
  <ul>
    <li><b>Càmera en directe.</b> Necessita HTTPS (per exemple, si l'has penjat a GitHub Pages) o localhost. Des d'un fitxer local al mòbil pot no estar disponible.</li>
    <li><b>Foto o captura.</b> Funciona sempre, també en local. Pots fer la foto al moment o triar-la de la galeria.</li>
    <li>Fa servir el lector del navegador si en té; si no, un lector incorporat al fitxer (jsQR). Amb el lector del navegador també pot reconèixer Aztec, Data Matrix o PDF417.</li>
  </ul>

  <h3 id="h-semafor">Com llegir el semàfor</h3>
  <div class="sem3">
    <div class="g"><b>Cap alerta.</b> No s'ha detectat cap senyal d'estafa. No vol dir que sigui de fiar: només que no hi ha cap senyal de les que sabem mirar.</div>
    <div class="y"><b>Revisa'l.</b> Hi ha alguna cosa que no quadra o que cal verificar abans d'obrir-lo.</div>
    <div class="r"><b>Sospitós.</b> Hi ha senyals típics d'estafa o la destinació està amagada. No l'obris si no saps d'on ve.</div>
  </div>
  <p>Cada color s'explica amb els motius concrets, escrits en paraules. El color sol no és la resposta: llegeix els motius.</p>

  <h3 id="h-comprova">Què comprova en una adreça</h3>
  <p>El nom que mana és el <b>domini real</b>: el tros just abans del primer <code>/</code>, llegit de dreta a esquerra. Per això el destaca en gran i atenua els subdominis. A <code>paypal.com.cobrament.top</code> el domini real és <code>cobrament.top</code>, no PayPal.</p>
  <ul>
    <li>Un <code>@</code> abans del domini (<code>banc.com@lladre.com</code>): el navegador va a l'adreça de després de l'<code>@</code>.</li>
    <li>Lletres d'altres alfabets que imiten les llatines (cirílic, grec) i dominis en format <code>xn--</code>.</li>
    <li>Adreça IP en lloc d'un nom, inclosos els formats ofuscats.</li>
    <li>Escurçadors d'enllaços (bit.ly, tinyurl…): la destinació queda amagada.</li>
    <li><code>http</code> sense xifrat, ports estranys, massa subdominis, terminacions molt usades en estafes.</li>
    <li>Noms de marques conegudes (bancs, correus, paqueteria, administracions, serveis digitals) en dominis que no són els oficials, i escriptures gairebé iguals.</li>
    <li>Paràmetres de redirecció (<code>url=</code>, <code>redirect=</code>…) que envien a una altra adreça.</li>
    <li>Plataformes on qualsevol pot crear una web (github.io, web.app…) i serveis de formularis o documents de tercers.</li>
    <li>Caràcters invisibles o de control, i esquemes que no són web (<code>javascript:</code>, <code>intent://</code>, <code>itms-services://</code>).</li>
  </ul>

  <h3 id="h-altres">Altres tipus de QR</h3>
  <p>Wi-Fi, telèfon, SMS, correu, ubicació, contactes, esdeveniments, pagaments (SEPA i criptomonedes), claus 2FA i text. En tots, guaitaQR només <b>mostra</b> el contingut, mai l'executa. Les contrasenyes i claus surten amagades fins que prems «Mostra». Si hi ha enllaços a dins, també s'analitzen. Els números de tarifació especial, els <i>intents</i> d'Android i les instal·lacions d'apps fora de botiga es marquen en vermell.</p>

  <h3 id="h-curts">Escurçadors i QR dinàmics</h3>
  <p>Molts QR no porten l'adreça final, sinó una adreça curta que redirigeix. Sense xarxa, guaitaQR només veu l'adreça curta. Per això avisa en vermell: <b>la destinació és opaca</b> i, a més, pot canviar després d'imprimir el QR, o ser diferent segons el dispositiu.</p>
  <p>Què pots fer: en tinyurl i bit.ly, copia l'enllaç de previsualització que t'ofereix l'eina i obre'l per veure la destinació sense visitar-la. En altres escurçadors, copia l'adreça i desplega-la amb un servei extern des d'un altre dispositiu. Si no vols investigar, no l'obris.</p>

  <h3 id="h-limits">Què no pot detectar</h3>
  <ul>
    <li>Un domini acabat de registrar que sembla normal però no imita cap marca de la llista.</li>
    <li>Una web legítima que ha estat compromesa.</li>
    <li>Adhesius de QR enganxats damunt d'un altre (en un parquímetre, un restaurant, un cartell). Comprova que el QR no sigui un adhesiu superposat.</li>
    <li>Les llistes de marques, escurçadors i terminacions són parcials. Les heurístiques ajuden, però no substitueixen el teu criteri.</li>
  </ul>
  <div class="nota">Regla pràctica: si el semàfor és verd però el domini <b>no és el que esperaves</b>, no l'obris.</div>

  <h3 id="h-bones">Bones pràctiques</h3>
  <ul>
    <li>Comprova que el domini real correspon a l'organització que esperes.</li>
    <li>Després d'escanejar un QR que no has demanat, no hi posis contrasenyes ni dades de pagament. Escriu tu l'adreça o fes servir l'app oficial.</li>
    <li>Els pagaments, confirma'ls a l'app del banc, no a la pàgina a la qual et porta el QR.</li>
    <li>Desconfia de la pressa: «paquet retingut», «multa», «compte bloquejat».</li>
    <li>El gestor de contrasenyes no omple dades en un domini que no és el teu: és un bon senyal d'alerta.</li>
  </ul>

  <h3 id="h-copiar">En copiar per analitzar fora</h3>
  <p>Copiar al porta-retalls és l'única sortida de dades, i només passa quan tu prems el botó. Si després enganxes l'adreça en un analitzador extern, aquell servei la rebrà. Moltes adreces porten dins fitxes personals (correu, codis, identificadors): abans d'enganxar-la, mira si les conté.</p>

  <h3 id="h-proba">Prova d'aïllament</h3>
  <p>La prova intenta una connexió a un domini inexistent (<code>.invalid</code>) i comprova si el navegador la bloqueja amb la política de seguretat. No surt cap dada: aquest domini no existeix.</p>
  <button class="btn" id="btnProba" type="button">Executa la prova</button>
  <p class="prova" id="provaRes" role="status"></p>

  <h3 id="h-sobre">Sobre guaitaQR</h3>
  <p>Versió 1.0. Part de Guaita Apps. Llicència AGPL-3.0-only. Inclou jsQR 1.4.0 (Apache-2.0) i les tipografies IBM Plex (SIL OFL 1.1).</p>
</template>

  if(Array.isArray(c)){c.forEach(x=>add(e,x));return;}
  e.appendChild(typeof c==='string'?document.createTextNode(c):c);
}
function el(tag,attrs){
  const e=document.createElement(tag);
  if(attrs){for(const k in attrs){
    const v=attrs[k]; if(v===false||v==null)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }}
  for(let i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function buida(n){while(n.firstChild)n.removeChild(n.firstChild);}

const INVIS_G=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u00AD\u200B-\u200F\u2028\u2029\u202A-\u202E\u2060-\u2064\u2066-\u2069\uFEFF]/g;
const INVIS=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u00AD\u200B-\u200F\u2028\u2029\u202A-\u202E\u2060-\u2064\u2066-\u2069\uFEFF]/;
const BIDI=/[\u202A-\u202E\u2066-\u2069]/;
function hex4(c){return 'U+'+c.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0');}
function parts(s){ // text amb caràcters invisibles fets visibles
  const out=[];let last=0;
  s.replace(INVIS_G,(m,i)=>{if(i>last)out.push({t:s.slice(last,i)});out.push({t:'['+hex4(m)+']',iv:true});last=i+m.length;return m;});
  if(last<s.length)out.push({t:s.slice(last)});
  return out;
}

const LV={g:0,i:0,y:1,r:2};
function maxLv(a,b){return LV[b]>LV[a]?b:a;}

/* =====================================================================
   Punycode (RFC 3492) per mostrar els dominis IDN en Unicode
   ===================================================================== */
function puniDecode(input){
  const base=36,tMin=1,tMax=26,skew=38,damp=700;
  function adapt(delta,num,first){
    delta=first?Math.floor(delta/damp):delta>>1;delta+=Math.floor(delta/num);
    let k=0;while(delta>(((base-tMin)*tMax)>>1)){delta=Math.floor(delta/(base-tMin));k+=base;}
    return k+Math.floor((base-tMin+1)*delta/(delta+skew));
  }
  const out=[];let n=128,i=0,bias=72;
  let b=input.lastIndexOf('-');if(b<0)b=0;
  for(let j=0;j<b;j++){if(input.charCodeAt(j)>=128)throw new Error('punycode');out.push(input.charCodeAt(j));}
  for(let idx=b>0?b+1:0;idx<input.length;){
    const oldi=i;let w=1;
    for(let k=base;;k+=base){
      if(idx>=input.length)throw new Error('punycode');
      const cp=input.charCodeAt(idx++);
      const digit=cp>=0x30&&cp<0x3A?26+(cp-0x30):cp>=0x41&&cp<0x5B?cp-0x41:cp>=0x61&&cp<0x7B?cp-0x61:base;
      if(digit>=base)throw new Error('punycode');
      i+=digit*w;
      const t=k<=bias?tMin:(k>=bias+tMax?tMax:k-bias);
      if(digit<t)break;
      w*=base-t;
    }
    const len=out.length+1;
    bias=adapt(i-oldi,len,oldi===0);
    n+=Math.floor(i/len);i%=len;
    out.splice(i++,0,n);
  }
  return String.fromCodePoint.apply(null,out);
}
function hostUnicode(h){
  return h.split('.').map(l=>{
    if(/^xn--/i.test(l)){try{return puniDecode(l.slice(4));}catch(e){return l;}}
    return l;
  }).join('.');
}

const CONF={'а':'a','с':'c','е':'e','о':'o','р':'p','х':'x','у':'y','і':'i','ј':'j','ѕ':'s','ԁ':'d','һ':'h','ӏ':'l','ԛ':'q','ԝ':'w','ο':'o','ν':'v','ι':'i','α':'a','ρ':'p'};
const CYR_LOOK='асеорхуіјѕԁһӏԛԝ';
function fold(s){
  s=s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  let o='';for(const ch of s)o+=CONF[ch]||ch;return o;
}
function leet(s){return s.replace(/0/g,'o').replace(/1/g,'l').replace(/3/g,'e').replace(/5/g,'s').replace(/rn/g,'m').replace(/vv/g,'w');}
function lev1(a,b){
  if(a===b)return false;if(Math.abs(a.length-b.length)>1)return false;
  let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  if(a.length===b.length)return a.slice(i+1)===b.slice(i+1)||(a[i]===b[i+1]&&a[i+1]===b[i]&&a.slice(i+2)===b.slice(i+2));
  if(a.length>b.length)return a.slice(i+1)===b.slice(i);
  return b.slice(i+1)===a.slice(i);
}
const SCRIPT_RE=['Latin','Cyrillic','Greek','Han','Hiragana','Katakana','Hangul','Arabic','Hebrew','Thai','Devanagari','Armenian','Georgian']
  .map(n=>[n,new RegExp('\\p{Script='+n+'}','u')]);
function scriptsOf(label){
  const s=new Set();
  for(const ch of label){for(const [n,re] of SCRIPT_RE){if(re.test(ch)){s.add(n==='Hiragana'||n==='Katakana'?'Han':n);break;}}}
  return s;
}
function registrable(h){
  const L=h.split('.');if(L.length<=2)return h;
  const l2=L.slice(-2).join('.');
  if(SLD2.has(l2)||HOSTING.has(l2))return L.slice(-3).join('.');
  return l2;
}
function esEscurcador(h){return SHORTENERS.some(d=>h===d||h.endsWith('.'+d));}
function preview(h,path){
  const code=path.replace(/^\/+/,'').split(/[/?#]/)[0];
  if(!code)return null;
  if(h==='tinyurl.com'||h==='www.tinyurl.com')return 'https://preview.tinyurl.com/'+code;
  if(h==='bit.ly'||h==='www.bit.ly')return 'https://bit.ly/'+code+'+';
  return null;
}
function brandsIn(hostFold){
  const toks=hostFold.split(/[.\-_]/).filter(Boolean);const exact=new Set(),loose=new Set();
  for(const b in BRANDS){
    for(const t0 of toks){
      const cands=[t0,leet(t0)];
      if(cands.includes(b)){exact.add(b);break;}
      if(b.length>=6&&cands.some(t=>t.startsWith(b)||t.endsWith(b))){loose.add(b);}
    }
  }
  loose.forEach(b=>{if(exact.has(b))loose.delete(b);});
  return {exact:[...exact],loose:[...loose]};
}

/* =====================================================================
   Anàlisi d'una URL (tot local, amb el mateix parser que el navegador)
   ===================================================================== */
const HOST_RE=/^([a-z][a-z0-9+.\-]*:[\/\\]*)((?:[^\/?#\\]*@)?)(\[[^\]]*\]|[^\/?#\\:]*)/i;
function analitzaURL(raw,implicit){
  const R=[];const afegeix=(n,t,d)=>R.push({n,t,d:d||''});
  const tr=raw.trim();
  let s=tr;if(implicit)s='https://'+tr;
  let u;
  try{u=new URL(s);}catch(e){
    return {ok:false,raw,level:'r',reasons:[{n:'r',t:'Adreça mal formada',d:'El navegador no la sap interpretar.'}]};
  }
  const scheme=u.protocol.slice(0,-1);
  const hm=HOST_RE.exec(s);
  const rawHost=hm?hm[3]:'';
  let segs=null;
  if(hm){
    const b=implicit?0:hm[1].length,ui=hm[2].length,hl=hm[3].length;
    segs={pre:tr.slice(0,b),user:tr.slice(b,b+ui),host:tr.slice(b+ui,b+ui+hl),rest:tr.slice(b+ui+hl)};
  }
  let host=u.hostname.replace(/\.$/,'');
  const isV6=host.startsWith('[');
  const isV4=/^\d{1,3}(\.\d{1,3}){3}$/.test(host);
  const isIP=isV4||isV6;
  const hostU=isIP?host:hostUnicode(host);
  const foldHost=fold(hostU);
  const tld=host.split('.').pop();
  const reg=isIP?host:registrable(host);
  const regU=isIP?host:registrable(hostU);
  const sub=isIP?'':hostU.slice(0,hostU.length-regU.length);
  const isShort=!isIP&&esEscurcador(host);
  const web=(scheme==='http'||scheme==='https');

  // Caràcters estranys
  if(/[\t\n\r]/.test(tr))afegeix('r','Hi ha salts de línia o tabuladors dins l\'adreça','El navegador els elimina en silenci i l\'adreça real pot ser una altra que la que veus.');
  else if(/\s/.test(tr))afegeix('y','Hi ha espais dins l\'adreça','No és habitual en una adreça web.');
  if(INVIS.test(tr)){
    afegeix(BIDI.test(tr)?'r':'y',BIDI.test(tr)?'Caràcters que canvien el sentit del text':'Caràcters invisibles o de control','Amaguen part de l\'adreça. Es mostren marcats a l\'adreça completa.');
  }
  // Esquema
  if(!web){
    if(scheme==='ftp')afegeix('y','Esquema ftp','No és una web; transferència de fitxers sense xifrar.');
    else afegeix('y','Esquema «'+scheme+':»','No és una adreça web.');
  }else if(scheme==='http')afegeix('y','Sense xifrat (http)','Les dades viatgen sense protecció i es poden alterar pel camí.');
  if(implicit)afegeix('i','El QR no indica https://','El mòbil l\'obrirà com a web. Aquí s\'analitza com si fos https://.');
  // Credencials
  if(u.username||u.password){
    afegeix('r','Conté «'+(u.username+(u.password?':'+u.password:''))+'@» abans del domini','Truc clàssic: el que hi ha abans de l\'@ no és el destí. El navegador va a '+host+'.');
  }
  // Host
  if(rawHost&&/%/.test(rawHost))afegeix('r','Caràcters codificats (%) dins del host','Serveix per amagar el nom real del domini.');
  if(isIP){
    const priv=isV4&&(/^(10|127)\./.test(host)||/^192\.168\./.test(host)||/^172\.(1[6-9]|2\d|3[01])\./.test(host)||/^169\.254\./.test(host));
    if(priv)afegeix('y','Adreça de xarxa local','Només funciona dins d\'una xarxa concreta; un QR públic no hauria de portar aquí.');
    else afegeix('r','Adreça IP en lloc d\'un nom','Les entitats legítimes fan servir noms de domini, no números.');
    if(isV4&&rawHost&&rawHost!==host)afegeix('r','IP escrita en un format ofuscat','S\'escriu com «'+rawHost+'» i equival a '+host+'.');
  }else{
    if(/^(localhost)$/.test(host)||/\.(local|lan|internal)$/.test(host))afegeix('y','Nom de xarxa local','No és una adreça pública d\'internet.');
    // IDN
    const puny=/(^|\.)xn--/i.test(host);
    if(puny){
      let mixed=false,lookalike=false;
      hostU.split('.').forEach(l=>{
        const sc=scriptsOf(l);
        if(sc.size>1)mixed=true;
        if(sc.size===1&&sc.has('Cyrillic')&&[...l].every(ch=>CYR_LOOK.includes(ch)||/[\d-]/.test(ch)))lookalike=true;
      });
      if(mixed)afegeix('r','Barreja d\'alfabets en un mateix nom','Lletres d\'altres alfabets imiten les llatines (homògrafs). Forma tècnica: '+host+'.');
      else if(lookalike)afegeix('r','Sembla llatí però és cirílic','Totes les lletres són ciríl·liques idèntiques a les llatines. Forma tècnica: '+host+'.');
      else afegeix('y','Domini amb caràcters no ASCII','Forma tècnica: '+host+'. Comprova que és el nom que esperaves.');
    }
    // Escurçador
    if(isShort)afegeix('r','Escurtador d\'enllaços: la destinació està amagada','Només veus l\'adreça curta. Pot canviar després d\'imprimir el QR. Sense xarxa no es pot saber on porta.');
    // Plataformes i tercers
    if(HOSTING.has(reg.split('.').slice(-2).join('.'))&&reg.split('.').length>=3)afegeix('y','Plataforma on qualsevol crea una web','El subdomini «'+reg.split('.')[0]+'» el pot haver creat qualsevol persona.');
    if(THIRD.has(host))afegeix('y','Domini legítim amb contingut de tercers','L\'adreça és de '+reg+', però el contingut concret el pot haver creat qualsevol.');
    // Terminació
    if(RISKY_TLD.has(tld))afegeix('y','Terminació «.'+tld+'» molt usada en estafes',(tld==='zip'||tld==='mov')?'Coincideix amb una extensió de fitxer i pot confondre.':'No vol dir que sigui falsa, però és molt habitual en campanyes fraudulentes.');
    // Subdominis
    const nSub=sub?sub.replace(/\.$/,'').split('.').length:0;
    if(nSub>=3)afegeix('y','Molts subdominis ('+nSub+')','Es fa servir per posar un nom conegut al davant i amagar el domini real.');
    // Guions
    const mainLabel=regU.split('.')[0];
    if((mainLabel.match(/-/g)||[]).length>=3)afegeix('y','Domini amb molts guions','Patró habitual en dominis creats per suplantar.');
    // Marques
    const off=b=>BRANDS[b].includes(reg)||(BRAND_PAT[b]&&BRAND_PAT[b].test(reg));
    const bi=brandsIn(foldHost);
    bi.exact.filter(b=>!off(b)).forEach(b=>afegeix('r','«'+BRAND_NAMES[b]+'» apareix a l\'adreça, però '+reg+' no és cap domini oficial conegut',
      'Domini real: '+reg+'. Si no és el de l\'organització que esperes, no l\'obris.'));
    bi.loose.filter(b=>!off(b)).forEach(b=>afegeix('y','Sembla imitar '+BRAND_NAMES[b],'El nom va enganxat a altres paraules dins '+reg+', que no és un domini oficial conegut.'));
    const ml=leet(fold(mainLabel));
    Object.keys(BRANDS).forEach(b=>{
      if(b.length>=6&&!off(b)&&!bi.exact.includes(b)&&!bi.loose.includes(b)&&lev1(ml,b))afegeix('y','«'+mainLabel+'» s\'assembla molt a «'+b+'»','Una lletra de diferència pot ser una imitació del nom real.');
    });
    // Paraules de phishing
    if(mainLabel.includes('-')){
      const w=fold(mainLabel).split('-').filter(t=>PHISH_WORDS.includes(t));
      if(w.length)afegeix('y','Paraules típiques de suplantació al domini: '+w.join(', '),'Combinades amb guions són habituals en estafes.');
    }
  }
  // Port
  if(u.port)afegeix('y','Port no estàndard ('+u.port+')','Les webs normals no el necessiten.');
  // Camí i paràmetres
  const query=[];u.searchParams.forEach((v,k)=>query.push([k,v]));
  const pathL=fold(dec(u.pathname));
  if(/https?:\/\//i.test(dec(u.pathname)))afegeix('y','El camí conté una altra adreça','Es fa servir per fer creure que l\'enllaç va a un altre lloc.');
  query.forEach(([k,v])=>{
    if(REDIR_KEYS.test(k)&&(/^(https?:)?\/\//i.test(v)||/^[\w-]+(\.[\w-]+)+(\/|$)/.test(v))){
      let dest='';try{dest=new URL(/^\/\//.test(v)?'https:'+v:(/^https?:/i.test(v)?v:'https://'+v)).hostname;}catch(e){}
      afegeix('y','Paràmetre de redirecció «'+k+'»','Envia després a '+(dest||v)+'. Comprova-ho abans de continuar.');
    }
  });
  if(!isIP){
    const off=b=>BRANDS[b].includes(reg)||(BRAND_PAT[b]&&BRAND_PAT[b].test(reg));
    const extra=[];
    Object.keys(BRANDS).forEach(b=>{
      if(b.length>=5&&pathL.split(/[^a-z0-9]+/).includes(b)&&!off(b))extra.push(BRAND_NAMES[b]);
    });
    if(extra.length&&!R.some(x=>/apareix a l'adreça/.test(x.t)))afegeix('y','El camí esmenta '+extra.join(', '),'El domini real és '+reg+', que no és oficial.');
  }
  R.sort((a,b)=>LV[b.n]-LV[a.n]);
  let level='g';R.forEach(x=>{level=maxLv(level,x.n);});
  return {ok:true,raw,trimmed:tr,implicit:!!implicit,href:u.href,scheme,web,host,hostU,reg,regU,sub,dom:isIP?host:regU,isIP,puny:!isIP&&/(^|\.)xn--/i.test(host),
    port:u.port,user:u.username,pass:u.password,path:u.pathname,query,hash:u.hash,segs,
    level,reasons:R,short:isShort,preview:isShort?preview(host,u.pathname):null};
}

/* =====================================================================
   Interpretació de qualsevol contingut de QR
   ===================================================================== */
function urlsInText(t){
  const m=t.match(/\bhttps?:\/\/[^\s<>"'`]+|\bwww\.[^\s<>"'`]+/gi)||[];
  const out=[];
  m.forEach(x=>{x=x.replace(/[.,;:!?)\]}]+$/,'');if(x&&!out.includes(x))out.push(x);});
  return out.slice(0,5);
}
function splitEsc(body){
  const parts=[];let cur='';
  for(let i=0;i<body.length;i++){
    const c=body[i];
    if(c==='\\'&&i+1<body.length){cur+=body[++i];continue;}
    if(c===';'){parts.push(cur);cur='';continue;}
    cur+=c;
  }
  if(cur)parts.push(cur);
  const o={};parts.forEach(p=>{const k=p.indexOf(':');if(k>0)o[p.slice(0,k).toUpperCase()]=p.slice(k+1);});
  return o;
}
function premium(num){
  const d=num.replace(/[^\d+]/g,'').replace(/^00/,'+');
  if(/^(\+34)?(80[367]|905)\d{6}$/.test(d))return 'r';
  if(/^(\+34)?(90[12]\d{6}|118\d\d)$/.test(d))return 'y';
  return '';
}
const TIPUS_CODI={qr_code:'QR',micro_qr_code:'Micro QR',aztec:'Aztec',data_matrix:'Data Matrix',pdf417:'PDF417'};
function mk(type,tag,o){
  const r=Object.assign({type,tag,level:'g',reasons:[],fields:[],links:[],url:null,copies:{},raw:''},o||{});
  return r;
}
function ambEnllacos(r,text){
  urlsInText(text).forEach(u=>{
    const a=analitzaURL(u,!/^https?:/i.test(u));
    if(a.ok){r.links.push(a);r.level=maxLv(r.level,a.level);}
  });
  return r;
}
function interpreta(raw){
  const t=raw.trim();
  let r;
  const inv=[];
  if(INVIS.test(raw)){inv.push({n:BIDI.test(raw)?'r':'y',t:BIDI.test(raw)?'Caràcters que canvien el sentit del text':'Caràcters invisibles o de control',d:'Es mostren marcats al contingut.'});}
  const sch=(/^([a-z][a-z0-9+.\-]*):/i.exec(t)||[])[1];
  const sl=sch?sch.toLowerCase():'';
  const bare=/^(?:[a-z0-9\u00a1-\uffff](?:[a-z0-9\u00a1-\uffff\-]{0,61}[a-z0-9\u00a1-\uffff])?\.)+[a-z\u00a1-\uffff]{2,}(?::\d+)?(?:[\/?#]\S*)?$/i.test(t);

  if(/^begin:vcard/i.test(t)){
    r=mk('vcard','Contacte',{raw});
    const g=k=>{const m=new RegExp('^'+k+'(?:;[^:\\n]*)?:(.*)$','im').exec(t);return m?m[1].trim():'';};
    [['Nom','FN'],['Organització','ORG'],['Càrrec','TITLE'],['Telèfon','TEL'],['Correu','EMAIL'],['Web','URL'],['Adreça','ADR'],['Nota','NOTE']].forEach(([k,c])=>{const v=g(c);if(v)r.fields.push({k,v:v.replace(/;+/g,' ').trim()});});
    r.reasons.push({n:'i',t:'Afegirà un contacte',d:'Comprova que el nom i el telèfon són els que esperes.'});
    ambEnllacos(r,t);
  }else if(/^mecard:/i.test(t)){
    r=mk('mecard','Contacte',{raw});
    const o=splitEsc(t.slice(7));
    [['Nom','N'],['Telèfon','TEL'],['Correu','EMAIL'],['Web','URL'],['Adreça','ADR'],['Organització','ORG'],['Nota','NOTE']].forEach(([k,c])=>{if(o[c])r.fields.push({k,v:o[c].replace(/,/g,' ')});});
    r.reasons.push({n:'i',t:'Afegirà un contacte',d:'Comprova que el nom i el telèfon són els que esperes.'});
    ambEnllacos(r,t);
  }else if(/^begin:v(event|calendar)/i.test(t)){
    r=mk('event','Esdeveniment',{raw});
    const g=k=>{const m=new RegExp('^'+k+'(?:;[^:\\n]*)?:(.*)$','im').exec(t);return m?m[1].trim():'';};
    [['Títol','SUMMARY'],['Inici','DTSTART'],['Fi','DTEND'],['Lloc','LOCATION'],['Descripció','DESCRIPTION'],['Web','URL']].forEach(([k,c])=>{const v=g(c);if(v)r.fields.push({k,v});});
    r.reasons.push({n:'i',t:'Afegirà un esdeveniment al calendari',d:''});
    ambEnllacos(r,t);
  }else if(/^wifi:/i.test(t)){
    r=mk('wifi','Wi-Fi',{raw});
    const o=splitEsc(t.slice(5));
    const sec=(o.T||'').toUpperCase();
    r.fields.push({k:'Xarxa',v:o.S||'(sense nom)'});
    r.fields.push({k:'Seguretat',v:!sec||sec==='NOPASS'?'Oberta (sense contrasenya)':sec});
    if(o.P)r.fields.push({k:'Contrasenya',v:o.P,secret:true});
    if(/^true$/i.test(o.H||''))r.fields.push({k:'Xarxa oculta',v:'Sí'});
    r.level='y';
    r.reasons.push({n:'y',t:'Et connectarà a una xarxa Wi-Fi',d:'Una xarxa desconeguda pot veure i alterar el que envies. Connecta\'t només si saps de qui és.'});
    if(!sec||sec==='NOPASS')r.reasons.push({n:'y',t:'Xarxa oberta',d:'Sense xifrat: qualsevol pot llegir el trànsit.'});
    if(sec==='WEP')r.reasons.push({n:'y',t:'Seguretat WEP',d:'Està trencada des de fa anys.'});
  }else if(/^(tel|sms|smsto|mms|mmsto):/i.test(t)){
    const isTel=sl==='tel';
    r=mk(isTel?'tel':'sms',isTel?'Telèfon':'SMS',{raw});
    let num='',body='';
    if(/^(smsto|mmsto):/i.test(t)){const rest=t.slice(sch.length+1);const k=rest.indexOf(':');num=k<0?rest:rest.slice(0,k);body=k<0?'':rest.slice(k+1);}
    else{const rest=t.slice(sch.length+1);const q=rest.search(/[?;&]/);num=q<0?rest:rest.slice(0,q);const bm=/[?&;]body=([^&;]*)/i.exec(rest);body=bm?dec(bm[1]):'';}
    num=dec(num);
    r.fields.push({k:isTel?'Número':'Destinatari',v:num});
    if(body)r.fields.push({k:'Missatge',v:body});
    const p=premium(num);
    if(p==='r'){r.level='r';r.reasons.push({n:'r',t:'Número de tarifació especial',d:'Els números 803, 806, 807 i 905 poden cobrar-te diners per trucada o per missatge.'});}
    else if(p==='y'){r.level='y';r.reasons.push({n:'y',t:'Número amb tarifa especial o compartida',d:'Comprova el cost abans de trucar o escriure.'});}
    if(!isTel){r.level=maxLv(r.level,'y');r.reasons.push({n:'y',t:'Prepara un SMS',d:'No s\'envia fins que tu el confirmes, però un missatge a un número de pagament o a un desconegut pot ser una estafa.'});}
    ambEnllacos(r,body);
  }else if(/^(mailto|matmsg):/i.test(t)){
    r=mk('mail','Correu',{raw});
    if(sl==='matmsg'){const o=splitEsc(t.slice(7));if(o.TO)r.fields.push({k:'Destinatari',v:o.TO});if(o.SUB)r.fields.push({k:'Assumpte',v:o.SUB});if(o.BODY){r.fields.push({k:'Cos',v:o.BODY});ambEnllacos(r,o.BODY);}}
    else{
      const rest=t.slice(7);const q=rest.indexOf('?');const to=dec(q<0?rest:rest.slice(0,q));
      r.fields.push({k:'Destinatari',v:to});
      if(q>=0)new URLSearchParams(rest.slice(q+1)).forEach((v,k)=>{const kk=k.toLowerCase();const nm={subject:'Assumpte',body:'Cos',cc:'Còpia',bcc:'Còpia oculta'}[kk];if(nm)r.fields.push({k:nm,v});if(kk==='body')ambEnllacos(r,v);});
    }
    r.reasons.push({n:'i',t:'Prepara un correu',d:'No s\'envia fins que tu el confirmes.'});
  }else if(sl==='geo'){
    r=mk('geo','Ubicació',{raw});
    const rest=t.slice(4);const q=rest.indexOf('?');const c=(q<0?rest:rest.slice(0,q)).split(',');
    r.fields.push({k:'Latitud',v:c[0]||''});r.fields.push({k:'Longitud',v:c[1]||''});
    if(q>=0){const p=new URLSearchParams(rest.slice(q+1));if(p.get('q'))r.fields.push({k:'Etiqueta',v:p.get('q')});}
    r.reasons.push({n:'i',t:'Només són coordenades',d:'No s\'obre res fins que tu ho decideixis.'});
  }else if(sl==='otpauth'||sl==='otpauth-migration'){
    r=mk('otp','Compte 2FA',{raw,level:'y'});
    if(sl==='otpauth-migration'){
      r.fields.push({k:'Contingut',v:'Migració de comptes 2FA ('+t.length+' caràcters)'});
      r.reasons.push({n:'y',t:'Conté secrets de diversos comptes 2FA',d:'Només ha d\'aparèixer quan tu exportes els teus comptes des d\'una app d\'autenticació.'});
    }else{
      try{const u=new URL(t);const lab=dec(u.pathname.replace(/^\/+/,''));
        r.fields.push({k:'Tipus',v:(u.hostname||'').toUpperCase()});
        r.fields.push({k:'Compte',v:lab});
        if(u.searchParams.get('issuer'))r.fields.push({k:'Emissor',v:u.searchParams.get('issuer')});
        if(u.searchParams.get('secret'))r.fields.push({k:'Clau secreta',v:u.searchParams.get('secret'),secret:true});
      }catch(e){r.fields.push({k:'Contingut',v:t});}
      r.reasons.push({n:'y',t:'Afegirà un compte d\'autenticació en dos passos',d:'Només ha d\'aparèixer quan tu configures el 2FA d\'un compte teu, al lloc oficial. Qui té la clau pot generar els teus codis.'});
    }
  }else if(sl==='intent'){
    r=mk('intent','Intent d\'Android',{raw,level:'r'});
    const pk=/;package=([^;]+)/.exec(t),sc=/;scheme=([^;]+)/.exec(t),fb=/;S\.browser_fallback_url=([^;]+)/.exec(t);
    if(pk)r.fields.push({k:'Paquet',v:pk[1]});if(sc)r.fields.push({k:'Esquema',v:sc[1]});if(fb)r.fields.push({k:'Adreça alternativa',v:dec(fb[1])});
    r.reasons.push({n:'r',t:'Ordre interna d\'Android',d:'Pot llançar apps o obrir adreces amb paràmetres arbitraris. Un QR normal no en necessita.'});
    if(fb)ambEnllacos(r,dec(fb[1]));
  }else if(/^(javascript|data|vbscript|file|blob|about):/i.test(t)){
    r=mk('perill','Codi o fitxer local',{raw,level:'r'});
    r.fields.push({k:'Contingut',v:t.length>400?t.slice(0,400)+'…':t});
    r.reasons.push({n:'r',t:'Esquema «'+sl+':»: no és un enllaç web',d:'Pot executar codi o mostrar contingut inserit. No l\'obris.'});
  }else if(sl==='itms-services'){
    r=mk('perill','Instal·lació d\'app',{raw,level:'r'});
    r.fields.push({k:'Contingut',v:t});
    r.reasons.push({n:'r',t:'Instal·lació d\'una app fora de l\'App Store',d:'Es fa servir per instal·lar programari maliciós a l\'iPhone.'});
  }else if(/^(bitcoin|bitcoincash|litecoin|ethereum|monero|dogecoin|solana|tron|cardano|dash|zcash|stellar|ripple):/i.test(t)){
    r=mk('pagament','Pagament cripto',{raw,level:'y'});
    const rest=t.slice(sch.length+1).replace(/^\/\//,'');const q=rest.indexOf('?');
    r.fields.push({k:'Moneda',v:sl});r.fields.push({k:'Adreça',v:q<0?rest:rest.slice(0,q)});
    if(q>=0)new URLSearchParams(rest.slice(q+1)).forEach((v,k)=>{const nm={amount:'Import',label:'Etiqueta',message:'Missatge'}[k.toLowerCase()];if(nm)r.fields.push({k:nm,v});});
    r.reasons.push({n:'y',t:'Prepara un pagament',d:'Comprova l\'adreça sencera i l\'import. Les transaccions cripto no es poden revertir.'});
  }else if(/^BCD\r?\n\d{3}\r?\n\d\r?\nSCT/.test(t)){
    r=mk('pagament','Pagament SEPA',{raw,level:'y'});
    const L=t.split(/\r?\n/);
    if(L[5])r.fields.push({k:'Beneficiari',v:L[5]});if(L[6])r.fields.push({k:'IBAN',v:L[6]});if(L[7])r.fields.push({k:'Import',v:L[7]});
    const c=L[10]||L[9];if(c)r.fields.push({k:'Concepte',v:c});
    r.reasons.push({n:'y',t:'Prepara una transferència',d:'Comprova el nom del beneficiari, l\'IBAN i l\'import a l\'app del banc.'});
  }else if(sl&&!/^https?$|^ftp$/.test(sl)&&!bare){
    r=mk('esquema','Esquema d\'app',{raw,level:'y'});
    r.fields.push({k:'Esquema',v:sl+':'});r.fields.push({k:'Contingut',v:t.length>400?t.slice(0,400)+'…':t});
    r.reasons.push({n:'y',t:'Obre una app concreta, no una web',d:'L\'esquema «'+sl+':» el gestiona una aplicació instal·lada. Comprova que és la que esperes.'});
  }else if(/^(https?|ftp):/i.test(t)||bare){
    const a=analitzaURL(t,!/^(https?|ftp):/i.test(t));
    r=mk('url','Enllaç web',{raw,url:a,level:a.level,reasons:a.reasons.slice()});
    r.copies.url=raw;if(a.ok){r.copies.host=a.host;if(a.preview)r.copies.preview=a.preview;}
    r.openHref=a.ok&&a.web?a.href:null;
  }else{
    const bin=/\uFFFD/.test(raw)||(raw.match(INVIS_G)||[]).length>Math.max(3,raw.length*.1);
    r=mk(bin?'binari':'text',bin?'Dades binàries':'Text',{raw});
    r.fields.push({k:'Contingut',v:t.length>1500?t.slice(0,1500)+'…':t});
    if(bin){r.level='y';r.reasons.push({n:'y',t:'Contingut no textual',d:'No es pot mostrar com a text. No és una adreça ni una dada coneguda.'});}
    else r.reasons.push({n:'i',t:'Text pla',d:'No és una adreça web ni cap format conegut.'});
    ambEnllacos(r,t);
  }
  if(r.type!=='url'){
    r.copies.text=raw;
    r.reasons=inv.concat(r.reasons);
    inv.forEach(x=>{r.level=maxLv(r.level,x.n);});
  }
  r.reasons.sort((a,b)=>LV[b.n]-LV[a.n]);
  return r;
}

const S={cur:null,tec:true,menu:null,lastFocus:null,prevURL:null};
const VER={
  g:['Cap alerta','No s\'ha detectat cap senyal d\'estafa. No és una garantia: comprova que el domini és el que esperes.'],
  y:['Revisa\'l','Hi ha senyals que cal mirar abans de fer res més.'],
  r:['Sospitós','Hi ha senyals típics d\'estafa. No l\'obris si no saps d\'on ve.']
};
const NOM_NIVELL={r:'Alerta',y:'Atenció',i:'Nota',g:'Nota'};

function toast(m){
  const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200);
}
function estat(m,err){const e=$('#estat');e.textContent=m||'';e.className='estat'+(err?' e':'');}

async function copia(text,etiqueta){
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok){
    const ta=el('textarea',{readonly:true,style:'position:fixed;left:-9999px;top:0;opacity:0'});ta.value=text;
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
    try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
  }
  toast(ok?etiqueta+' copiat':'No s\'ha pogut copiar. Selecciona-ho i copia-ho a mà.');
  return ok;
}

function semafor(level){
  const s=el('div',{class:'sem','aria-hidden':'true'});
  ['r','y','g'].forEach(n=>s.appendChild(el('i',{class:n+(n===level?' on':'')})));
  return s;
}
function hostView(a){
  const v=el('div',{class:'hv'});
  if(a.isIP){v.appendChild(el('span',{class:'dom',text:a.host}));}
  else{
    if(a.sub)v.appendChild(el('span',{class:'sub',text:a.sub}));
    v.appendChild(el('span',{class:'dom',text:a.dom}));
  }
  return v;
}
function llistaMotius(reasons){
  const ul=el('ul',{class:'mot'});
  reasons.forEach(m=>{
    const li=el('li',{class:m.n},el('em',{text:NOM_NIVELL[m.n]}),el('b',{text:m.t}));
    if(m.d)li.appendChild(el('span',{text:m.d}));
    ul.appendChild(li);
  });
  return ul;
}
function adrecaCompleta(a){
  const box=el('div',{class:'adr'});
  const pushParts=(txt,cls)=>parts(txt).forEach(p=>{
    if(p.iv)box.appendChild(el('span',{class:'iv',text:p.t}));
    else box.appendChild(cls?el(cls==='mark'?'mark':'span',cls==='mark'?{text:p.t}:{class:cls,text:p.t}):document.createTextNode(p.t));
  });
  if(a.segs){
    pushParts(a.segs.pre);
    if(a.segs.user)pushParts(a.segs.user,'ui');
    pushParts(a.segs.host,'mark');
    pushParts(a.segs.rest);
  }else pushParts(a.raw);
  return box;
}
function campsLlista(fields){
  const dl=el('dl',{class:'dl'});
  fields.forEach(f=>{
    dl.appendChild(el('dt',{text:f.k}));
    const dd=el('dd',{class:f.n||''});
    if(f.secret){
      const span=el('span',{text:'••••••••'});let shown=false;
      const b=el('button',{type:'button',class:'btn mini','aria-pressed':'false',text:'Mostra',onclick:()=>{
        shown=!shown;span.textContent=shown?f.v:'••••••••';b.textContent=shown?'Amaga':'Mostra';b.setAttribute('aria-pressed',shown?'true':'false');}});
      dd.appendChild(span);dd.appendChild(b);
    }else dd.textContent=f.v;
    dl.appendChild(dd);
  });
  return dl;
}
function desglossament(a){
  const f=[];
  f.push({k:'Esquema',v:a.scheme});
  if(a.user||a.pass)f.push({k:'Usuari (abans de l\'@)',v:a.user+(a.pass?':'+a.pass:''),n:'r'});
  f.push({k:'Host',v:a.hostU+(a.puny?'  ('+a.host+')':'')});
  if(!a.isIP)f.push({k:'Domini real',v:a.regU});
  if(a.port)f.push({k:'Port',v:a.port,n:'y'});
  f.push({k:'Camí',v:a.path||'/'});
  if(a.query.length)f.push({k:'Paràmetres',v:a.query.map(q=>q[0]+' = '+q[1]).join('\n')});
  if(a.hash)f.push({k:'Fragment',v:a.hash});
  const dl=campsLlista(f);
  dl.querySelectorAll('dd').forEach(d=>{d.style.whiteSpace='pre-wrap';});
  return dl;
}
function seccio(titol,node,id){
  const s=el('div',{class:'sec'});if(id)s.id=id;
  if(titol)s.appendChild(el('h3',{text:titol}));
  s.appendChild(node);return s;
}
function botonsURL(r){
  const a=r.url;const fil=el('div',{class:'fil'});
  fil.appendChild(el('button',{type:'button',class:'btn',text:'Copia URL',onclick:()=>copia(r.copies.url,'URL completa')}));
  if(a.ok)fil.appendChild(el('button',{type:'button',class:'btn',text:'Copia host',onclick:()=>copia(r.copies.host,'Host')}));
  if(r.copies.preview)fil.appendChild(el('button',{type:'button',class:'btn',text:'Copia previsualització',onclick:()=>copia(r.copies.preview,'Enllaç de previsualització')}));
  if(r.openHref)fil.appendChild(el('button',{type:'button',class:'btn'+(r.level==='r'?' risc':''),text:'Obre l\'enllaç…',onclick:()=>confirmaObrir(r)}));
  return fil;
}
function renderEnllacIncrustat(a){
  const box=el('div',{class:'enl n-'+a.level});
  if(a.ok){
    box.appendChild(hostView(a));
    if(a.reasons.length)box.appendChild(llistaMotius(a.reasons));
    else box.appendChild(el('p',{class:'tec',text:'Cap alerta en aquest enllaç.'}));
    box.appendChild(el('div',{class:'fil'},el('button',{type:'button',class:'btn',text:'Copia URL',onclick:()=>copia(a.raw,'URL completa')}),
      el('button',{type:'button',class:'btn',text:'Copia host',onclick:()=>copia(a.host,'Host')})));
  }else box.appendChild(el('p',{text:a.raw}));
  return box;
}
function render(r){
  const box=$('#res');buida(box);
  box.className='n-'+r.level;
  const sub=r.sub||(r.type==='url'?VER[r.level][1]:(r.level==='g'?'No s\'ha detectat cap senyal d\'estafa. Revisa igualment el que mostra.':r.level==='y'?VER.y[1]:VER.r[1]));
  box.appendChild(el('div',{class:'verd'},
    el('div',null,el('span',{class:'tipus',text:r.tag+(r.format&&r.format!=='qr_code'&&TIPUS_CODI[r.format]?' en '+TIPUS_CODI[r.format]:'')}),el('h2',{text:VER[r.level][0]}),el('p',{text:sub})),
    semafor(r.level)));
  if(r.type==='url'){
    const a=r.url;
    if(a.ok){
      const h=el('div',{class:'host'});h.appendChild(hostView(a));
      if(a.puny)h.appendChild(el('p',{class:'tec',text:'Forma tècnica: '+a.host}));
      box.appendChild(seccio('On apunta realment',h));
    }
    if(r.reasons.length)box.appendChild(seccio('Motius',llistaMotius(r.reasons)));
    else box.appendChild(seccio('Motius',el('p',{class:'tec',text:'Cap comprovació ha saltat. Això no garanteix que l\'enllaç sigui de fiar.'})));
    if(a.ok)box.appendChild(seccio('Adreça completa',adrecaCompleta(a)));
    else box.appendChild(seccio('Adreça completa',el('div',{class:'adr',text:r.raw})));
    box.appendChild(botonsURL(r));
    if(a.ok&&S.tec)box.appendChild(seccio('Desglossament',desglossament(a),'tec'));
  }else{
    if(r.reasons.length)box.appendChild(seccio('Motius',llistaMotius(r.reasons)));
    if(r.fields.length)box.appendChild(seccio('Contingut',campsLlista(r.fields)));
    r.links.forEach((a,i)=>box.appendChild(seccio(i===0?'Enllaços dins del contingut':'',renderEnllacIncrustat(a))));
    box.appendChild(el('div',{class:'fil'},el('button',{type:'button',class:'btn',text:'Copia contingut',onclick:()=>copia(r.copies.text,'Contingut')})));
    const cru=el('div',{class:'adr'});parts(r.raw).forEach(p=>cru.appendChild(p.iv?el('span',{class:'iv',text:p.t}):document.createTextNode(p.t)));
    box.appendChild(seccio('Text decodificat',cru));
  }
  actualitzaMenus();
}
function renderBuit(){
  const box=$('#res');buida(box);box.className='';
  box.appendChild(el('div',{class:'buitres'},el('h2',{text:'Mira on porta abans d\'obrir'}),
    el('p',{text:'Escaneja un QR amb la càmera o tria una foto. Veuràs l\'adreça real, separada en parts, i els senyals d\'alerta. Res no s\'obre ni s\'envia.'})));
}
function acceptaText(text,format){
  const r=interpreta(text);r.format=format;S.cur=r;render(r);estat('');
  if(window.matchMedia&&matchMedia('(max-width:859px)').matches)$('#res').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- Modal ---------- */
function obreModal(titol,cos,peu,opts){
  S.lastFocus=document.activeElement;
  $('#mtit').textContent=titol;
  const b=$('#mbody');buida(b);b.appendChild(cos);
  const f=$('#mfoot');buida(f);(peu||[]).forEach(x=>f.appendChild(x));f.style.display=(peu&&peu.length)?'flex':'none';
  const m=$('#mod');m.classList.add('open');m.setAttribute('aria-hidden','false');
  $('#mcard').focus();
  if(opts&&opts.after)opts.after();
}
function tancaModal(){
  const m=$('#mod');if(!m.classList.contains('open'))return;
  m.classList.remove('open');m.setAttribute('aria-hidden','true');
  buida($('#mbody'));buida($('#mfoot'));
  if(S.lastFocus&&S.lastFocus.focus)try{S.lastFocus.focus();}catch(e){}
}
function confirmaObrir(r){
  const a=r.url;
  const cos=el('div',{class:'ctx n-'+r.level});
  cos.appendChild(el('p',{text:'Aniràs a aquest domini:'}));
  cos.appendChild(hostView(a));
  if(r.short)cos.appendChild(el('p',{text:'És un escurçador: no sabem on acaba portant.'}));
  cos.appendChild(el('p',{text:'L\'enllaç s\'obrirà en una pestanya nova, fora de guaitaQR.'}));
  const chk=r.level==='r'?el('input',{type:'checkbox',id:'chkRisc'}):null;
  const cancel=el('button',{type:'button',class:'btn primary',text:'Cancel·la',onclick:tancaModal});
  const go=el('button',{type:'button',class:'btn risc',text:'Obre en pestanya nova',onclick:()=>{
    if(chk&&!chk.checked){toast('Marca la casella per continuar');return;}
    const an=el('a',{href:a.href,target:'_blank',rel:'noopener noreferrer'});document.body.appendChild(an);an.click();document.body.removeChild(an);tancaModal();
  }});
  const peu=[];
  if(chk)peu.push(el('label',{for:'chkRisc'},chk,'Entenc que pot ser una estafa'));
  peu.push(cancel,go);
  obreModal('Obrir l\'enllaç',cos,peu);
}
function provaAillament(){
  return new Promise(resolve=>{
    let violat=false;
    const h=()=>{violat=true;};
    document.addEventListener('securitypolicyviolation',h);
    let p;
    try{p=fetch('https://guaitaqr.invalid/prova',{mode:'no-cors',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});}catch(e){}
    Promise.resolve(p).catch(()=>{}).then(()=>setTimeout(()=>{document.removeEventListener('securitypolicyviolation',h);resolve(violat);},200));
  });
}
async function executaProva(){
  const out=$('#provaRes');if(!out)return;
  out.className='prova';out.textContent='Executant la prova…';
  const ok=await provaAillament();
  if(ok){out.className='prova ok';out.textContent='Superada: el navegador ha bloquejat l\'intent de connexió amb la política connect-src \'none\'.';}
  else{out.className='prova no';out.textContent='No s\'ha pogut confirmar el bloqueig. La petició anava a un domini inexistent, així que no ha sortit cap dada, però aquest navegador no ha informat de la política. Com a comprovació alternativa, activa el mode avió.';}
  return ok;
}
function obreAjuda(seccioId,prova){
  const cos=document.createElement('div');
  cos.appendChild($('#tplAjuda').content.cloneNode(true));
  cos.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const t=cos.querySelector('#'+b.getAttribute('data-go'));if(t)t.scrollIntoView({block:'start'});}));
  const bp=cos.querySelector('#btnProba');if(bp)bp.addEventListener('click',executaProva);
  obreModal('Com funciona guaitaQR: seguretat',cos,[el('button',{type:'button',class:'btn primary',text:'Entesos',onclick:tancaModal})],{after:()=>{
    if(seccioId){const t=$('#'+seccioId);if(t)t.scrollIntoView({block:'start'});}
    if(prova)executaProva();
  }});
}
function obreSobre(){obreAjuda('h-sobre',false);}

/* ---------- Menús en cascada ---------- */
const MENUS=[
  {id:'fitxer',t:'Fitxer',items:[
    {t:'Escaneja amb càmera',a:()=>toggleCamera()},
    {t:'Tria foto o captura…',a:()=>$('#fileIn').click()},
    {t:'Enganxa imatge',a:()=>enganxaImatge()},
    '-',
    {t:'Neteja',a:()=>neteja(),en:()=>!!S.cur||cam.active||$('#vista').classList.contains('foto')}]},
  {id:'edita',t:'Edita',items:[
    {t:'Copia URL completa',a:()=>S.cur&&S.cur.copies.url&&copia(S.cur.copies.url,'URL completa'),en:()=>!!(S.cur&&S.cur.copies.url)},
    {t:'Copia host',a:()=>S.cur&&S.cur.copies.host&&copia(S.cur.copies.host,'Host'),en:()=>!!(S.cur&&S.cur.copies.host)},
    {t:'Copia enllaç de previsualització',a:()=>S.cur&&S.cur.copies.preview&&copia(S.cur.copies.preview,'Enllaç de previsualització'),en:()=>!!(S.cur&&S.cur.copies.preview)},
    {t:'Copia contingut decodificat',a:()=>S.cur&&copia(S.cur.raw,'Contingut'),en:()=>!!S.cur}]},
  {id:'veure',t:'Veure',items:[
    {t:'Desglossament per parts',chk:()=>S.tec,a:()=>{S.tec=!S.tec;if(S.cur)render(S.cur);}}]},
  {id:'ajuda',t:'Ajuda',items:[
    {t:'Com funciona (seguretat)',a:()=>obreAjuda()},
    {t:'Prova d\'aïllament de xarxa',a:()=>obreAjuda('h-proba',true)},
    '-',
    {t:'Sobre guaitaQR',a:()=>obreSobre()}]}
];
function construeixMenus(){
  const bar=$('#menubar');buida(bar);
  MENUS.forEach(m=>{
    const wrap=el('div',{class:'mb','data-id':m.id});
    const btn=el('button',{type:'button',role:'menuitem','aria-haspopup':'true','aria-expanded':'false',text:m.t,onclick:e=>{e.stopPropagation();alternaMenu(m.id);}});
    const dd=el('div',{class:'dd',role:'menu','aria-label':m.t});
    m.items.forEach(it=>{
      if(it==='-'){dd.appendChild(el('hr'));return;}
      const b=el('button',{type:'button',role:it.chk?'menuitemcheckbox':'menuitem',onclick:e=>{e.stopPropagation();tancaMenus();it.a();}});
      if(it.chk){b.appendChild(el('span',{class:'ck','aria-hidden':'true'}));}
      b.appendChild(document.createTextNode(it.t));
      it._b=b;dd.appendChild(b);
    });
    wrap.appendChild(btn);wrap.appendChild(dd);bar.appendChild(wrap);m._w=wrap;m._btn=btn;
  });
  actualitzaMenus();
}
function actualitzaMenus(){
  MENUS.forEach(m=>m.items.forEach(it=>{
    if(it==='-'||!it._b)return;
    if(it.en)it._b.disabled=!it.en();
    if(it.chk){const on=it.chk();it._b.setAttribute('aria-checked',on?'true':'false');it._b.querySelector('.ck').textContent=on?'✓':'';}
  }));
}
function tancaMenus(){
  MENUS.forEach(m=>{if(!m._w)return;m._w.classList.remove('open','dir');m._btn.setAttribute('aria-expanded','false');});
  S.menu=null;
}
function alternaMenu(id){
  const obert=S.menu===id;tancaMenus();if(obert)return;
  actualitzaMenus();
  const m=MENUS.find(x=>x.id===id);m._w.classList.add('open');m._btn.setAttribute('aria-expanded','true');S.menu=id;
  const dd=m._w.querySelector('.dd');
  const r=dd.getBoundingClientRect();
  if(r.right>window.innerWidth-4)m._w.classList.add('dir');
}
document.addEventListener('click',()=>{if(S.menu)tancaMenus();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#mod').classList.contains('open')){tancaModal();return;}
    if(S.menu){const b=MENUS.find(x=>x.id===S.menu)._btn;tancaMenus();b.focus();}
    return;
  }
  if($('#mod').classList.contains('open')&&e.key==='Tab'){
    const f=[...$('#mcard').querySelectorAll('button,input,[href],[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null||x.id==='mclose');
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#mcard'))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    return;
  }
  if(S.menu&&['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const idx=MENUS.findIndex(x=>x.id===S.menu);
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=(idx+(e.key==='ArrowRight'?1:-1)+MENUS.length)%MENUS.length;alternaMenu(MENUS[n].id);const f=MENUS[n]._w.querySelector('.dd button:not([disabled])');if(f)f.focus();return;}
    const bs=[...MENUS[idx]._w.querySelectorAll('.dd button:not([disabled])')];
    let i=bs.indexOf(document.activeElement);i=e.key==='ArrowDown'?(i+1)%bs.length:(i-1+bs.length)%bs.length;if(bs[i])bs[i].focus();
  }
});

/* =====================================================================
   Lectura: càmera i imatges
   ===================================================================== */
const cam={stream:null,timer:0,active:false,busy:false};
const cv=document.createElement('canvas');
let detector=null,detectorProvat=false;
async function getDetector(){
  if(detectorProvat)return detector;detectorProvat=true;
  try{
    if('BarcodeDetector' in window){
      const f=(await BarcodeDetector.getSupportedFormats()).filter(x=>TIPUS_CODI[x]);
      if(f.length)detector=new BarcodeDetector({formats:f});
    }
  }catch(e){detector=null;}
  return detector;
}
async function descodifica(src,w,h,limit){
  const d=await getDetector();
  if(d){try{const r=await d.detect(src);if(r&&r.length&&r[0].rawValue)return {text:r[0].rawValue,format:r[0].format};}catch(e){}}
  if(typeof jsQR!=='function')return null;
  const lim=limit||800,k=Math.max(w,h)>lim?lim/Math.max(w,h):1;
  cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,cv.width,cv.height);
  const id=x.getImageData(0,0,cv.width,cv.height);
  const q=jsQR(id.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});
  return q&&q.data?{text:q.data,format:'qr_code'}:null;
}
function aturaCamera(){
  cam.active=false;clearTimeout(cam.timer);
  if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;}
  const v=$('#video');try{v.pause();}catch(e){}v.srcObject=null;
  $('#vista').classList.remove('viu');$('#btnCam').textContent='Escaneja amb càmera';
  actualitzaMenus();
}
function bucle(){
  if(!cam.active)return;
  cam.timer=setTimeout(async()=>{
    if(!cam.active)return;
    const v=$('#video');
    if(v.readyState>=2&&!cam.busy){
      cam.busy=true;
      try{const r=await descodifica(v,v.videoWidth,v.videoHeight,800);
        if(r){aturaCamera();cam.busy=false;if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}acceptaText(r.text,r.format);return;}
      }catch(e){}
      cam.busy=false;
    }
    bucle();
  },120);
}
async function toggleCamera(){
  if(cam.active){aturaCamera();estat('');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){
    estat('La càmera en directe necessita HTTPS o localhost. Des d\'un fitxer local, fes servir «Tria foto».',true);return;
  }
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    estat(e&&e.name==='NotAllowedError'?'Permís de càmera denegat. Activa\'l als ajustos del navegador o fes servir «Tria foto».':'No s\'ha pogut obrir la càmera'+(e&&e.name?' ('+e.name+')':'')+'. Fes servir «Tria foto».',true);return;
  }
  treuPrevia();
  const v=$('#video');v.srcObject=cam.stream;
  try{await v.play();}catch(e){}
  cam.active=true;$('#vista').classList.add('viu');$('#btnCam').textContent='Atura la càmera';
  estat('Apunta al QR. No es desa ni s\'envia res.');actualitzaMenus();bucle();
}
function treuPrevia(){
  const i=$('#prev');i.removeAttribute('src');if(S.prevURL){try{URL.revokeObjectURL(S.prevURL);}catch(e){}S.prevURL=null;}
  $('#vista').classList.remove('foto');
}
function neteja(){
  aturaCamera();treuPrevia();S.cur=null;renderBuit();estat('');actualitzaMenus();
}
async function carregaImatge(blob){
  if(window.createImageBitmap){try{return await createImageBitmap(blob);}catch(e){}}
  return await new Promise((ok,ko)=>{
    const u=URL.createObjectURL(blob),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);ok(im);};im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('imatge'));};im.src=u;
  });
}
async function llegeixImatge(blob){
  aturaCamera();treuPrevia();
  if(!blob||!/^image\//.test(blob.type||'image/')){estat('Aquest fitxer no és una imatge.',true);return;}
  S.prevURL=URL.createObjectURL(blob);$('#prev').src=S.prevURL;$('#vista').classList.add('foto');
  estat('Analitzant la imatge…');
  let img;try{img=await carregaImatge(blob);}catch(e){estat('No s\'ha pogut llegir la imatge.',true);return;}
  const W=img.width||img.naturalWidth,H=img.height||img.naturalHeight;
  for(const lim of [1600,1000,640,2400]){
    await new Promise(r=>setTimeout(r,0));
    const k=Math.min(1,lim/Math.max(W,H));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let r=null;try{r=await descodifica(c,c.width,c.height,lim);}catch(e){}
    if(r){if(img.close)try{img.close();}catch(e){}acceptaText(r.text,r.format);return;}
  }
  if(img.close)try{img.close();}catch(e){}
  S.cur=null;renderBuit();actualitzaMenus();
  estat('No s\'ha trobat cap QR. Prova amb una foto més propera, recta i ben il·luminada.',true);
}
async function enganxaImatge(){
  try{
    const items=await navigator.clipboard.read();
    for(const it of items){const ty=it.types.find(x=>/^image\//.test(x));if(ty){await llegeixImatge(await it.getType(ty));return;}}
    estat('No hi ha cap imatge al porta-retalls.',true);
  }catch(e){estat('El navegador no permet llegir el porta-retalls. Enganxa amb Ctrl+V o tria la foto.',true);}
}

/* ---------- Esdeveniments ---------- */
$('#btnCam').addEventListener('click',toggleCamera);
$('#btnFoto').addEventListener('click',()=>$('#fileIn').click());
$('#fileIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)llegeixImatge(f);e.target.value='';});
$('#mclose').addEventListener('click',tancaModal);
$('#mod').addEventListener('click',e=>{if(e.target===$('#mod'))tancaModal();});
$('#netChip').addEventListener('click',()=>obreAjuda('h-aill'));
$('#peuAjuda').addEventListener('click',()=>obreAjuda());
document.addEventListener('paste',e=>{
  const its=e.clipboardData&&e.clipboardData.items;if(!its)return;
  for(const it of its){if(/^image\//.test(it.type)){const f=it.getAsFile();if(f){e.preventDefault();llegeixImatge(f);return;}}}
});
const vista=$('#vista');
vista.addEventListener('dragover',e=>e.preventDefault());
vista.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)llegeixImatge(f);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cam.active){aturaCamera();estat('Càmera aturada en sortir de la pàgina.');}});
window.addEventListener('pagehide',aturaCamera);

construeixMenus();renderBuit();

window.GQR={version:VERSION,interpreta,analitzaURL,puniDecode,hostUnicode,registrable,urlsInText,provaAillament,executaProva,acceptaText,obreAjuda,tancaModal,neteja,state:S};
})();
</script>
